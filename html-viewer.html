<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مستعرض HTML | Mo Tools</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <style>
    .editor-preview-container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    
    .editor-section, .preview-section {
      flex: 1;
    }
    
    #editor {
      width: 100%;
      min-height: 400px;
      font-size: 1rem;
      direction: ltr;
      text-align: left;
    }
    
    #preview {
      width: 100%;
      height: 400px;
      border: 1px solid var(--primary-color);
      background: white;
      border-radius: 5px;
    }
    
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    
    @media (max-width: 768px) {
      .editor-preview-container {
        flex-direction: column;
      }
      
      #preview {
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="terminal-frame">
      <div class="theme-selector">
        <label for="theme">اختر الثيم:</label>
        <select id="theme" onchange="changeTheme(this.value)">
          <option value="neon">Neon Green</option>
          <option value="purple">Purple Cyber</option>
          <option value="blue">Blue Ocean</option>
        </select>
      </div>
      <h1 class="glow-text">📄 مستعرض HTML</h1>
      <p>اكتب كود HTML و شاهد النتيجة فوريًا</p>
      <a href="index.html" class="btn">⬅ العودة للقائمة</a>
    </header>

    <!-- Main Content -->
    <main class="terminal-frame">
      <div class="toolbar">
        <button class="btn btn-primary" onclick="runCode()">⚡ تشغيل الكود</button>
        <button class="btn" onclick="clearEditor()">🗑 مسح الكود</button>
        <button class="btn" onclick="loadExample()">📚 مثال</button>
        <button class="btn copy-btn" data-target="editor">📋 نسخ الكود</button>
      </div>
      
      <div class="editor-preview-container">
        <!-- Editor Section -->
        <div class="editor-section">
          <h3>📝 الكود</h3>
          <textarea id="editor" placeholder="اكتب كود HTML هنا...">
<!DOCTYPE html>
<html>
<head>
    <title>مثال</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #f0f0f0;
        }
        h1 {
            color: #00ff88;
        }
    </style>
</head>
<body>
    <h1>مرحبا بالعالم!</h1>
    <p>هذا مثال بسيط لكود HTML</p>
    <button onclick="alert('مرحبا!')">اضغط هنا</button>
</body>
</html>
          </textarea>
        </div>
        
        <!-- Preview Section -->
        <div class="preview-section">
          <h3>👁 المعاينة</h3>
          <iframe id="preview" srcdoc=""></iframe>
        </div>
      </div>
      
      <div class="mt-20">
        <h3>💡 نصائح:</h3>
        <ul>
          <li>يمكنك كتابة HTML, CSS, JavaScript كامل</li>
          <li>المعاينة تظهر فورًا عند الكتابة (أو اضغط على "تشغيل الكود")</li>
          <li>استخدم زر "مثال" للحصول على كود جاهز</li>
        </ul>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>Made with <span class="heart">♥️</span> by Mohammed Hussein / <a href="https://iegy.net" target="_blank">iegy.net</a></p>
    </footer>
  </div>

  <script>
    // Load saved code from localStorage
    function loadSavedCode() {
      const savedCode = loadFromLocalStorage('html-viewer-code');
      if (savedCode) {
        document.getElementById('editor').value = savedCode;
        runCode();
      }
    }

    // Save code to localStorage
    function saveCode() {
      const code = document.getElementById('editor').value;
      saveToLocalStorage('html-viewer-code', code);
    }

    // Run the code
    function runCode() {
      const code = document.getElementById('editor').value;
      const preview = document.getElementById('preview');
      
      // Add base URL for relative paths
      const fullCode = `<base href="${window.location.origin}/">` + code;
      
      preview.srcdoc = fullCode;
      saveCode();
    }

    // Clear editor
    function clearEditor() {
      document.getElementById('editor').value = '';
      document.getElementById('preview').srcdoc = '';
      saveCode();
    }

    // Load example
    function loadExample() {
      const example = `<!DOCTYPE html>
<html>
<head>
    <title>مثال متقدم</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        h1 {
            color: #00ff88;
            font-size: 2.5em;
        }
        button {
            background: #00a2ff;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }
        button:hover {
            background: #00ff88;
            transform: scale(1.05);
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مرحبا في Mo Tools!</h1>
        <p>هذا مثال متقدم لكود HTML مع CSS</p>
        <button onclick="alert('مرحبا بك في عالم البرمجة!')">اضغط هنا</button>
        <div class="card">
            <h2>بطاقة</h2>
            <p>يمكنك تعديل هذا الكود و مشاهدة النتيجة فورًا</p>
        </div>
    </div>
    
    <script>
        console.log('مرحبا من JavaScript!');
    <\/script>
</body>
</html>`;
      
      document.getElementById('editor').value = example;
      runCode();
    }

    // Auto-run on input (debounced)
    let timeout;
    document.getElementById('editor').addEventListener('input', function() {
      clearTimeout(timeout);
      timeout = setTimeout(runCode, 500);
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
      loadSavedCode();
      // Run once initially
      if (!loadFromLocalStorage('html-viewer-code')) {
        runCode();
      }
    });
  </script>
</body>
</html>
